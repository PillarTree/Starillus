# Starillus OS configuration
# This file is read by the Starillus first-boot setup and by the App Center.
# It complements /etc/os-release.

[os]
name = Starillus
version = 1.0
codename = Nebula
base = debian-stable
desktop = pillarius
desktop_version = 2.0
browser = pilot
architecture = amd64, arm64

[package-management]
primary = apt
apt_repo = https://repo.starillus.dev/apt
secondary = flatpak
flatpak_remote = flathub

[app-center]
enabled = true
antivirus_scan_on_install = true
antivirus_scan_on_publish = true
quarantine_infected = true

[antivirus]
daemon = starillus-av
scan_on_download = true
scan_on_flatpak_install = true
scan_on_apt_install = false   # apt packages are signed; scanned at publish time

[pillarium]
theme = starillus-dark
wallpaper = starillus-dawn
quick_launch = pilot, terminal, file-manager, app-center
desktop_icons = app-center, pilot, terminal
