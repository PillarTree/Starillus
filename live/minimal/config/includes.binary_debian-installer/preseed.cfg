# Starillus OS preset configuration for live user
# Creates the "user" account with password "starillus"

# User account
user-setup-udeb/user-password password starillus
user-setup-udeb/user-password-again password starillus
user-setup-udeb/fullname string Starillus User
user-setup-udeb/username string user

# Timezone
tzdata/timezone string Etc/UTC
tzdata/areas string Etc
tzdata/zones string UTC

# Locale
localechooser/supported-locales en_US.UTF-8 multi select
localechooser/default-locale en_US.UTF-8 select

# Keyboard
keyboard-configuration/xkb-keymap us string

# Desktop meta-package selection
tasksel tasksel/first multiselect standard

# Install Starillus packages from local repository
d-i apt-setup/use_mirror boolean false
d-i apt-setup/local0/repository string http://repo.starillus.dev/apt stable main
d-i apt-setup/local0/keyfile string /cdrom/starillus-repo.gpg.key

# Disable popularity-contest
popularity-contest popularity-contest/participate boolean false

# GRUB bootloader installation
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Finish
d-i finish-install/reboot_in_progress note
