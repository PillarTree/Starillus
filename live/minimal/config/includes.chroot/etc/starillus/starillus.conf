# Starillus OS first-boot configuration
# Written into /etc/starillus/starillus.conf on the live image

[os]
name = Starillus
version = 1.0
codename = Nebula
base = debian-trixie
desktop = pillarius
desktop_version = 2.0
browser = pilot
architecture = amd64

[package-management]
primary = apt
secondary = flatpak

[app-center]
enabled = true
antivirus_scan_on_install = true

[antivirus]
daemon = starillus-av

[pillarium]
theme = starillus-dark
wallpaper = starillus-dawn
quick_launch = pilot, terminal, app-center
desktop_icons = app-center, pilot, terminal
